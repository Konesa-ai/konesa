<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Babata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===== HEADER ===== -->
  <header id="topbar">
    <button id="menu-btn" class="round-btn" type="button" aria-label="Meni">☰</button>
    <div class="brand">
      <div class="avatar-wrap">
        <img class="avatar" src="icon-512.png" alt="Babata">
        <span class="status-pill"><span class="status-dot"></span>Anliy</span>
      </div>
    </div>
    <button id="gift-btn" class="round-btn" type="button" aria-label="Kado">🎁</button>
  </header>

  <!-- ===== ZÒN PRINSIPAL ===== -->
  <main id="main">
    <section id="view-chat" class="view active">
      <div id="messages"></div>
    </section>
    <section id="view-fil" class="view panel-view">
      <h2>Fil</h2>
      <p class="soon">Byento — seksyon sa a ap vini.</p>
    </section>
    <section id="view-ide" class="view panel-view">
      <h2>Ide</h2>
      <p class="soon">Byento — seksyon sa a ap vini.</p>
    </section>
    <section id="view-objektif" class="view panel-view">
      <h2>Objektif</h2>
      <p class="soon">Byento — seksyon sa a ap vini.</p>
    </section>
    <section id="view-bibliyotek" class="view panel-view">
      <h2>Bibliyotèk</h2>
      <p class="soon">Byento — seksyon sa a ap vini.</p>
    </section>
  </main>

  <!-- ===== CHIP ATACHMAN (fichye chwazi a, pare pou voye) ===== -->
  <div id="attach-bar" class="hidden">
    <span id="attach-icon" aria-hidden="true">📷</span>
    <span id="attach-name"></span>
    <span id="attach-size"></span>
    <button id="attach-remove" type="button" aria-label="Retire fichye a">✕</button>
  </div>
  <input id="file-input" type="file" accept="image/*,video/*" hidden>

  <!-- ===== CHIP MÒD PROMPT EXPERT (parèt lè mòd la aktif) ===== -->
  <div id="prompt-mode-bar" class="hidden">
    <span class="pm-label">✨ Mòd Prompt Expert</span>
    <button id="prompt-mode-exit" type="button" aria-label="Soti nan mòd Prompt Expert">✕</button>
  </div>

  <!-- ===== BA MESAJ ===== -->
  <form id="composer" autocomplete="off">
    <button id="plus-btn" class="round-btn gray" type="button" aria-label="Plis">+</button>
    <button id="mic-btn" class="round-btn gray" type="button" aria-label="Mikwo">🎤</button>
    <textarea id="chat-input" rows="1" placeholder="Ekri mesaj ou a…"></textarea>
    <button id="send-btn" class="round-btn blue" type="submit" aria-label="Voye">➤</button>
  </form>

  <!-- ===== BA NAVIGASYON ANBA ===== -->
  <nav id="tabbar">
    <button class="tab active" type="button" data-view="chat"><span class="tab-ico">💬</span><span class="tab-label">Chat</span></button>
    <button class="tab" type="button" data-view="fil"><span class="tab-ico">🧵</span><span class="tab-label">Fil</span></button>
    <button class="tab" type="button" data-view="ide"><span class="tab-ico">💡</span><span class="tab-label">Ide</span></button>
    <button class="tab" type="button" data-view="objektif"><span class="tab-ico">🎯</span><span class="tab-label">Objektif</span></button>
    <button class="tab" type="button" data-view="bibliyotek"><span class="tab-ico">📚</span><span class="tab-label">Bibliyotèk</span></button>
  </nav>
</div>

<!-- ===== MENI SOU KOTE (DRAWER) ===== -->
<div id="drawer-overlay"></div>
<aside id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Babata</h2>
    <button id="drawer-close" class="round-btn small" type="button" aria-label="Fèmen">✕</button>
  </div>

  <nav class="drawer-nav">
    <button class="drawer-item active" type="button" data-view="chat">💬 Diskisyon prensipal</button>
    <button class="drawer-item" type="button" data-view="fil">🧵 Fil</button>
    <button class="drawer-item" type="button" data-view="ide">💡 Ide</button>
    <button class="drawer-item" type="button" data-view="objektif">🎯 Objektif</button>
    <button class="drawer-item" type="button" data-view="bibliyotek">📚 Bibliyotèk</button>
  </nav>

  <div class="drawer-section">
    <h3>Diskisyon paralèl</h3>
    <ul id="chat-list" class="chat-list"></ul>
    <h4 id="archived-title" class="archived-title">Achiv</h4>
    <ul id="archived-list" class="chat-list archived"></ul>
  </div>

  <div class="drawer-bottom">
    <input id="chat-search" type="search" placeholder="Chèche nan diskisyon yo…">
    <button id="settings-btn" class="drawer-action" type="button">⚙ Paramèt</button>
    <button id="new-chat-btn" class="drawer-action primary" type="button">➕ Nouvo chat</button>
  </div>
</aside>

<!-- ===== PANÈL AKSYON (bouton +) ===== -->
<div id="attach-sheet" class="sheet-overlay hidden">
  <div class="sheet-card">
    <button id="sheet-gallery" class="sheet-action" type="button">📷 Foto / Videyo (galeri)</button>
    <button id="sheet-link" class="sheet-action" type="button">🔗 Lyen TikTok / YouTube</button>
    <button id="sheet-prompt" class="sheet-action" type="button">✨ Prompt Expert — fabrike yon pwompt pwofesyonèl</button>
    <button id="sheet-cancel" class="sheet-action cancel" type="button">Anile</button>
  </div>
</div>

<!-- ===== PANÈL PARAMÈT ===== -->
<div id="settings-panel" class="modal hidden">
  <div class="modal-card">
    <h3>Paramèt</h3>
    <div class="memwa-section">
      <h4>🧠 Memwa Babata sou ou</h4>
      <div id="memwa-body"></div>
      <button id="memwa-wipe-btn" class="ghost" type="button">Efase memwa a</button>
      <p id="memwa-status" class="version"></p>
    </div>
    <button id="wipe-btn" class="danger" type="button">Efase tout istwa a</button>
    <p class="version">Vèsyon 1.0</p>
    <button id="settings-close" class="ghost" type="button">Fèmen</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
